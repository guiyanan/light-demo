[project]
name = "light-demo"
version = "0.1.0"
description = "光明乳业 · 小红书洞察驱动的新品概念生成 Demo"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/ui/pages/*" = ["N999"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --junitxml=logs/test/junit.xml"
filterwarnings = ["ignore::DeprecationWarning"]
