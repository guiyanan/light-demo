# 业务参数（不含密钥；密钥在 .env）
collect:
  candidate_notes: 40      # 先取搜索结果前 40 篇作候选
  min_note_comments: 3     # 评论数少于 3 的笔记不要
  max_notes: 10            # 从候选中按评论数挑 10 篇
  comments_per_note: 20    # 每篇 1 页评论（约 10 条），去掉水评论后全部保留
  max_comments: 200        # 评论总数上限（只是保险）
  default_keywords: ["低温酸奶"]

http:
  max_retries: 3           # 429 / 5xx 最多重试次数
  backoff_base_seconds: 1.0  # 指数退避：1s, 2s, 4s

xhs:
  timeout_seconds: 30

llm:
  timeout_seconds: 120
  temperature: 0.3

image:
  timeout_seconds: 180
  max_retries: 2           # 生图最多重试 2 次
  size: "1024x1024"

paths:
  data_dir: data
  logs_dir: logs
