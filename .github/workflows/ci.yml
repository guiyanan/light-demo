name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 代码检查 + 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: 安装中文字体
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: 安装依赖
        run: pip install -r requirements-dev.txt
      - name: ruff 代码检查
        run: ruff check .
      - name: 单元测试
        run: |
          mkdir -p logs/test
          set -o pipefail
          pytest --cov=app --cov-report=term-missing 2>&1 | tee logs/test/pytest.log
      - name: 上传测试日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: logs/
          if-no-files-found: ignore

  docker:
    name: docker compose build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像
        run: |
          mkdir -p logs/build
          set -o pipefail
          docker compose build 2>&1 | tee logs/build/compose-build.log
      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/build/
